[tool.poetry]
name = "biometric-attendance"
version = "0.1.0"
description = "Biometric Attendance Tracking System"
authors = ["PCSMO"]
readme = "README.md"
packages = [{ include = "biometric_attendance" }]

[tool.poetry.dependencies]
python = "^3.11"
PySide6 = "^6.7"
SQLAlchemy = "^2.0"
alembic = "^1.13"
bcrypt = "^4.1"
dependency-injector = "^4.41"
structlog = "^24.1"
reportlab = "^4.2"
openpyxl = "^3.1"
cryptography = "^50.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-qt = "^4.4"
pytest-cov = "^5.0"

[tool.poetry.scripts]
biometric-attendance = "biometric_attendance.app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["biometric_attendance"]
omit = ["*/tests/*", "*/migrations/*"]
